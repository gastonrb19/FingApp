    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="360" rx="18" fill="#0f172a"/>
  <text x="40" y="44" fill="#f1f5f9" font-size="22" font-weight="700">Cómo se alimenta el workflow</text>

  <!-- sources -->
  <rect x="34" y="80" width="240" height="92" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
