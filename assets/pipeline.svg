  <text x="54" y="132" fill="#94a3b8" font-size="14">README-TASK.md</text>
  <text x="54" y="152" fill="#94a3b8" font-size="14">README-HISTORYTASK.md</text>

  <rect x="34" y="196" width="240" height="92" rx="12" fill="#1e293b" stroke="#d946ef" stroke-width="1.5"/>
  <text x="54" y="224" fill="#e2e8f0" font-size="18" font-weight="700">fing-front · frontend</text>
  <text x="54" y="248" fill="#94a3b8" font-size="14">README-TASK.md</text>
  <text x="54" y="268" fill="#94a3b8" font-size="14">README-HISTORYTASK.md</text>

  <text x="154" y="316" text-anchor="middle" fill="#64748b" font-size="13">rama development</text>

